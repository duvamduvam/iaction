[package]
name = "iaction"
version = "0.9.1"
description = "IAction — desktop multi-fournisseur pour le développement assisté par IA"
authors = ["Dadou"]
edition = "2021"

[lib]
name = "iaction_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Déjà présent dans l'arbre (dépendance transitive de Tauri) : l'ajouter en
# direct ne coûte aucune compilation supplémentaire. Sert à horodater le
# journal de la coquille (voir journal_coquille).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Trousseau OS. "sync-secret-service" pilote le Secret Service (GNOME Keyring,
# KWallet…) via libdbus, en synchrone — recommandé par la doc de la crate même pour
# du code déjà async, car l'accès au trousseau reste de toute façon bloquant. Les
# features "apple-native"/"windows-native" n'entraînent aucune dépendance sur Linux
# (leurs deps sont gated par `target_os` dans le Cargo.toml de `keyring`) : elles ne
# servent qu'à préparer la compilation future sur macOS/Windows.
keyring = { version = "3", features = ["sync-secret-service", "apple-native", "windows-native"] }
# Coffre de secrets (docs/etude-coffre-secrets.md) : format `age` public et
# relu, implémentation Rust pure ; un coffre reste déchiffrable hors IAction
# par l'outil `age`. `zeroize` efface les valeurs en mémoire à la fermeture.
age = "0.11"
zeroize = "1"
# Sélecteur de dossier natif (page Agent : choix du répertoire projet).
tauri-plugin-dialog = "2"
# Une seule instance : relancer IAction ouvre une fenêtre dans l'instance en
# cours (voir `fenetres::ouvrir_fenetre`), jamais un second processus.
tauri-plugin-single-instance = "2"

# Lecture de l'image du presse-papier SYSTÈME, côté natif. Indispensable sous
# WebKitGTK (moteur Tauri Linux) : une capture d'écran présente dans le
# presse-papier n'est PAS exposée à l'événement `paste` du DOM — on la lit donc
# ici. `wayland-data-control` ajoute le repli Wayland (wlr-data-control) en plus
# de X11/XWayland. `image` (PNG seul) encode le RGBA brut renvoyé par arboard.
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Accès direct à la webview WebKitGTK, Linux uniquement. Sert à autoriser le
# micro (`getUserMedia`) pour la dictée vocale : WebKitGTK le refuse par défaut
# (réglage `enable-media-stream` désactivé + demande de permission rejetée).
# ⚠ Version épinglée sur celle qu'embarque déjà `wry` (le moteur webview de
# Tauri 2) — cf. Cargo.lock — pour partager la même pile GTK au lieu d'en
# compiler une seconde. À réaligner si une mise à jour de tauri/wry la change.
[target."cfg(target_os = \"linux\")".dependencies]
webkit2gtk = "=2.0.2"
# Verrouillage du coffre à la mise en veille et au verrouillage de session :
# signaux de logind sur le bus système. Même crate que celle qu'embarque déjà
# le trousseau (`keyring` → Secret Service) : aucune compilation en plus.
dbus = "0.9"

# Verrouillage de session sous Windows (`OpenInputDesktop`), et poste joint
# à un domaine (`NetGetJoinInformation`, avertissement des secrets sans
# fenêtre). Version déjà
# présente dans l'arbre (Cargo.lock).
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_StationsAndDesktops", "Win32_Foundation", "Win32_NetworkManagement_NetManagement"] }
