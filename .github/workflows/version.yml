# Construit les installeurs des DEUX plateformes et les attache à une release.
#
# Pourquoi : Tauri ne compile pas Windows depuis Linux. Sans cette CI, chaque
# version Windows réclamerait d'allumer un PC Windows et d'y refaire la chaîne
# complète. Ici, un runner `windows-latest` s'en charge — le poste de
# développement reste sous Linux, et le PC Windows ne sert plus qu'à UTILISER
# l'application.
#
# Déclenchement :
#   - étiquette `v*` poussée (ex. `git tag v0.1.0 && git push origin v0.1.0`)
#     → construit et publie une release avec les deux fichiers ;
#   - « Run workflow » depuis l'onglet Actions → construit et dépose les
#     fichiers en artefacts, sans rien publier.
#
# Rien à adapter par plateforme : `scripts/preparer-bundle.sh` tourne sous Git
# Bash (présent d'origine sur les runners Windows), télécharge le bon runtime
# Node et laisse npm ne poser que le CLI Claude de la plateforme visée.

name: Version

on:
  # Chaque poussée sur `main` construit les deux plateformes SANS rien publier :
  # c'est ce qui permet de découvrir une régression propre à Windows sans avoir
  # à créer une étiquette de version à chaque essai. Seule une étiquette `v*`
  # déclenche la publication (voir le job `publier`).
  push:
    branches: ["main"]
    tags: ["v*"]
  # Le PORTIQUE de publication : l'instantané arrive par une pull request
  # (scripts/publier-instantane.sh), et ce workflow tourne dessus AVANT la
  # fusion. Avec la protection de branche (voir docs/github.md), rien ne peut
  # atteindre `main` sans que « construire (ubuntu-latest) » et
  # « construire (windows-latest) » soient verts — la vérification complète
  # tourne donc sur une machine vierge, là où le poste local peut mentir par
  # omission (fichier jamais `git add`, dépendance présente par accident).
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  construire:
    strategy:
      # Une plateforme qui échoue ne doit pas annuler l'autre : on veut savoir
      # laquelle des deux casse, pas seulement qu'il y a eu un échec.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage
            artefact: appimage
          - os: windows-latest
            bundles: nsis
            artefact: nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Le crate Tauri est long à compiler ; le cache ramène les versions
      # suivantes à quelques minutes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Dépendances système de WebKitGTK — seulement sur Linux (Windows a
      # WebView2, et macOS WebKit, nativement).
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Dépendances npm
        run: npm ci

      # Les trois vérifications rapides d'abord — échouer en 30 s sur un hook
      # conditionnel ou un test unitaire vaut mieux qu'en 15 min au bout de la
      # compilation Rust.
      - name: Lint (rules-of-hooks — la règle qui a trouvé le plantage du 2026-08-07)
        run: npx eslint .

      # Le cliquet ne répare rien : il empêche que le découpage en cours soit
      # reperdu fichier par fichier. Ses propres tests passent d'abord — une
      # barrière qui ne peut plus échouer ne protège plus de rien.
      - name: Cliquet de taille (et ses tests)
        run: npm run cliquet:test && npm run cliquet

      # Le poste de développement est sous Linux, qui distingue `ModelPicker`
      # de `modelPicker` ; Windows non. Sans cette barrière, la collision ne se
      # voit qu'ici, à la compilation de l'installeur — T-039, découvert en
      # livrant la 0.3.1. Le contrôle tourne sur les DEUX plateformes : sur
      # Linux il est utile (il voit ce que le développeur ne voit pas), sur
      # Windows il est déjà trop tard mais le diagnostic reste lisible.
      - name: Collisions de casse (et ses tests)
        run: npm run casse:test && npm run casse

      # Le dépôt local EST le produit public depuis le 2026-08-07 : la
      # séparation qui protégeait par construction a disparu, et cet audit la
      # remplace. Ici les motifs littéraux (scripts/.audit-motifs) sont absents
      # — ils ne sont pas versionnés, par définition — donc seules les règles
      # structurelles tournent. C'est voulu : la CI attrape les formes,
      # l'exécution locale attrape en plus les noms.
      - name: Audit de publication (et ses tests)
        run: npm run audit:test && npm run audit

      # Le miroir tickets→issues (voir tickets.yml) ne tourne pas ici, mais
      # ses tests verrouillent le FORMAT de docs/tickets.md : une ligne de
      # tableau malformée doit casser avant d'atteindre le miroir.
      - name: Miroir des tickets (tests)
        run: npm run tickets:test

      - name: Tests unitaires UI (vitest)
        run: npm run test -w ui

      # Les journaux d'un run ne sont téléchargeables qu'avec des droits
      # d'administration sur le dépôt — inutilisables pour diagnostiquer depuis
      # l'extérieur. Les ANNOTATIONS, elles, sont exposées par l'API publique :
      # on y recopie donc les lignes d'échec, pour qu'un échec propre à une
      # plateforme soit lisible sans accès privilégié.
      - name: Tests du sidecar
        shell: bash
        run: |
          set +e
          npm run sidecar:test > sortie-tests.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            resume=$(grep -aE "ECHEC|AssertionError|Error:" sortie-tests.txt | head -4 | tr '\n' '¦')
            echo "::error title=Tests du sidecar (${{ matrix.os }})::${resume:-échec sans ligne reconnaissable}"
            echo "----- 60 dernières lignes -----"
            tail -60 sortie-tests.txt
          fi
          exit $code

      # OBLIGATOIRE AVANT `cargo test` : le script de build de Tauri vérifie
      # l'existence des ressources et du binaire externe déclarés dans
      # tauri.conf.json. Sans cette étape, cargo échoue avant même de compiler,
      # sur « resource path `binaries/node-…` doesn't exist » — ce qui passait
      # inaperçu en local, où le binaire traîne depuis le premier empaquetage.
      #
      # `tauri build` relancera ce même script (beforeBuildCommand) : le second
      # passage est idempotent et court (Node déjà téléchargé, npm en cache).
      - name: Préparer le bundle (requis par le script de build Tauri)
        run: npm run preparer-bundle

      # Même traitement que les tests du sidecar : les journaux de run étant
      # réservés aux administrateurs du dépôt, l'échec doit voyager par une
      # ANNOTATION, seule sortie lisible publiquement.
      - name: Tests Rust (cargo test)
        shell: bash
        working-directory: src-tauri
        run: |
          set +e
          cargo test --quiet > sortie-cargo.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            # Sortie BRUTE dans l'annotation, sans filtre : un premier essai
            # filtrait par motifs (`^error:`, `panicked`…) et n'a rien trouvé —
            # on ne connaissait donc toujours pas la cause. Quand on ignore la
            # forme de l'échec, on remonte le texte, pas un extrait choisi.
            # `%0A` est la façon dont GitHub encode un saut de ligne dans une
            # annotation ; `%25` protège les pourcents déjà présents.
            resume=$(tail -30 sortie-cargo.txt | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tests Rust (${{ matrix.os }})::${resume:-sortie vide}"
          fi
          exit $code

      # `beforeBuildCommand` déclenche scripts/preparer-bundle.sh : interface,
      # sidecar, bundle de ses dépendances d'exécution et runtime Node.
      #
      # Comme les tests, l'échec doit voyager par une ANNOTATION : le
      # 2026-08-13, `tauri build` a rendu « failed to run linuxdeploy » et RIEN
      # d'autre — pas une ligne de l'outil qui a échoué, donc aucune cause
      # (T-038). Tauri n'affiche pas la sortie de linuxdeploy quand il tombe ;
      # on la garde donc dans un fichier et on en recopie la fin.
      - name: Construire
        shell: bash
        env:
          # linuxdeploy et son greffon sont eux-mêmes des AppImages : sans FUSE
          # sur le runner, ils doivent s'extraire pour tourner. Sans effet là où
          # FUSE est présent, et sans effet sous Windows.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set +e
          # `--verbose` : sans lui, Tauri avale la sortie de linuxdeploy et
          # l'échec se résume à « failed to run linuxdeploy » (T-038). La
          # sortie part dans un fichier, dont on ne recopie que la fin.
          npx tauri build --verbose --bundles ${{ matrix.bundles }} > sortie-build.txt 2>&1
          code=$?
          tail -25 sortie-build.txt
          if [ "$code" -ne 0 ]; then
            resume=$(tail -40 sortie-build.txt | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Construire (${{ matrix.os }})::${resume:-sortie vide}"
          fi
          exit $code

      # Dire ce qui a été empaqueté, pas seulement que ça a réussi. Un
      # installeur peut se construire sans erreur en ayant SILENCIEUSEMENT
      # omis le CLI Claude : npm ne pose ses paquets par plateforme qu'en
      # dépendances optionnelles, et une omission ne casse rien au build —
      # elle ne se verrait qu'au premier tour d'agent, chez l'utilisateur.
      # `::notice::` est une annotation, donc lisible par l'API publique.
      - name: Inventaire de ce qui est embarqué
        shell: bash
        run: |
          bundle=$(du -sm build/sidecar-bundle | cut -f1)
          cli=$(ls build/sidecar-bundle/node_modules/@anthropic-ai/ 2>/dev/null | tr '\n' ' ')
          binaire=$(find build/sidecar-bundle/node_modules/@anthropic-ai -maxdepth 2 -name 'claude*' -type f -printf '%f=%sB ' 2>/dev/null || true)
          runtime=$(ls -l src-tauri/binaries/ | awk 'NR>1 {printf "%s=%sB ", $9, $5}')
          installeur=$(find src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*-setup.exe' \) -printf '%f=%sB ' 2>/dev/null || true)
          echo "::notice title=Contenu embarqué (${{ matrix.os }})::bundle=${bundle}Mo | @anthropic-ai: ${cli:-AUCUN} | CLI: ${binaire:-ABSENT} | runtime: ${runtime:-ABSENT} | installeur: ${installeur:-ABSENT}"

      - name: Déposer l'installeur en artefact
        uses: actions/upload-artifact@v4
        with:
          name: iaction-${{ matrix.artefact }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  publier:
    # Uniquement sur étiquette : un lancement manuel sert à vérifier que la
    # chaîne tient, pas à publier.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installeurs

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: installeurs/**/*
          generate_release_notes: true
          # L'installeur Windows n'est pas signé : SmartScreen affichera un
          # avertissement au premier lancement, contournable par
          # « Informations complémentaires → Exécuter quand même ». Voir
          # docs/empaquetage.md §4.
          body: |
            Installeurs construits automatiquement.

            - **Linux** : `.AppImage` — rendre exécutable puis lancer.
            - **Windows** : `-setup.exe` — installation pour l'utilisateur
              courant, sans droits d'administration. L'installeur n'étant pas
              signé, Windows affiche un avertissement au premier lancement.

            La voix locale n'est pas incluse (1,2 Go) ; elle s'installe après
            coup, voir `docs/empaquetage.md`.
