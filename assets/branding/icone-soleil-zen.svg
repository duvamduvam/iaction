<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- « Soleil zen » : soleil synthwave (stries qui s'épaississent vers l'horizon)
       enveloppé d'un anneau ensō ouvert en bas — le rétro-futur qui médite. -->
  <defs>
    <radialGradient id="sol-bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#0f1830"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="sol-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#7c6cf9"/>
      <stop offset="100%" stop-color="#f472d0"/>
    </linearGradient>
    <filter id="sol-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="sol-stries">
      <circle cx="256" cy="262" r="120" fill="#fff"/>
      <rect x="100" y="270" width="312" height="7" fill="#000"/>
      <rect x="100" y="294" width="312" height="10" fill="#000"/>
      <rect x="100" y="322" width="312" height="14" fill="#000"/>
      <rect x="100" y="354" width="312" height="19" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sol-bg)"/>
  <g filter="url(#sol-glow)">
    <circle cx="256" cy="262" r="120" fill="url(#sol-sun)" mask="url(#sol-stries)"/>
    <circle cx="256" cy="256" r="176" fill="none" stroke="#22d3ee" stroke-width="14"
      stroke-linecap="round" stroke-dasharray="995 111"
      transform="rotate(115 256 256)" opacity="0.9"/>
  </g>
</svg>
