<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- « Lotus-circuit » : une fleur de lotus tracée comme une piste de circuit
       imprimé — pétales en traits néon, pastilles aux pointes, trace au sol. -->
  <defs>
    <radialGradient id="lot-bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <filter id="lot-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#lot-bg)"/>
  <g filter="url(#lot-glow)" fill="none" stroke="#22d3ee" stroke-width="14" stroke-linecap="round">
    <path d="M 256 156 Q 308 240 256 322 Q 204 240 256 156 Z"/>
    <path d="M 256 156 Q 308 240 256 322 Q 204 240 256 156 Z" transform="rotate(42 256 322)"/>
    <path d="M 256 156 Q 308 240 256 322 Q 204 240 256 156 Z" transform="rotate(-42 256 322)"/>
    <path d="M 256 322 V 374 M 176 374 H 336" stroke="#7c6cf9"/>
  </g>
  <g filter="url(#lot-glow)" fill="#e879f9">
    <circle cx="256" cy="156" r="10"/>
    <circle cx="367" cy="199" r="10"/>
    <circle cx="145" cy="199" r="10"/>
    <circle cx="176" cy="374" r="8"/>
    <circle cx="336" cy="374" r="8"/>
  </g>
</svg>
