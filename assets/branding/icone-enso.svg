<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- « Ensō néon » : le cercle zen tracé d'un seul geste, dégradé cyan→magenta,
       ouverture en haut à droite marquée d'une étincelle. Minimal, lisible à 16px. -->
  <defs>
    <radialGradient id="ens-bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="ens-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="ens-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#ens-bg)"/>
  <g filter="url(#ens-glow)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ens-stroke)" stroke-width="30"
      stroke-linecap="round" stroke-dasharray="754 189"
      transform="rotate(-55 256 256)"/>
    <circle cx="268" cy="97" r="10" fill="#e879f9"/>
  </g>
</svg>
